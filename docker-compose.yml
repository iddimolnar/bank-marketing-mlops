# Single-command startup for the whole system: `docker compose up`.
# Services communicate over the default compose network using service names.
#
# NOTE: this environment's Docker registry proxy only allows official library
# images, so MinIO/S3 is not available. MLflow artifacts are therefore stored on a
# shared volume and served through the tracking server (proxied artifact access).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    environment:
      BACKEND_STORE_URI: postgresql://mlflow:mlflow@postgres:5432/mlflow
    ports:
      - "5001:5000"   # host 5001 (5000 is often taken by macOS AirPlay) -> container 5000
    volumes:
      - mlartifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      BANK_DATA_PATH: ${BANK_DATA_PATH:-data/fixtures/tiny_bank.csv}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  pg_data:
  mlartifacts: